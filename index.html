<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chapter 3 Practice Quiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>
  <div class="bg-grid" aria-hidden="true"></div>

  <main id="app" class="app">
    <section id="screen-start" class="screen screen-start is-active">
      <p class="eyebrow">Fractions · Decimals · Integers</p>
      <h1 class="brand">Chapter 3<br /><span>Practice Quiz</span></h1>
      <p class="lede">
        25 questions, plus a bonus. One question at a time — pick an answer and see if you’re right before moving on.
      </p>
      <div class="cta-row">
        <button type="button" class="btn btn-primary" id="btn-start">Start quiz</button>
        <button type="button" class="btn btn-ghost" id="btn-include-bonus">Include bonus</button>
      </div>
      <p class="meta" id="bonus-status">Bonus question: off</p>
    </section>

    <section id="screen-quiz" class="screen screen-quiz" hidden>
      <header class="quiz-bar">
        <div class="progress-wrap">
          <div class="progress-track" aria-hidden="true">
            <div class="progress-fill" id="progress-fill"></div>
          </div>
          <p class="progress-label">
            <span id="q-topic"></span>
            <span id="q-counter"></span>
          </p>
        </div>
        <p class="score-live" id="score-live">Score: 0</p>
      </header>

      <article class="question-panel" id="question-panel">
        <h2 class="question-text" id="question-text"></h2>
        <p class="question-prompt" id="question-prompt" hidden></p>
        <div class="choices" id="choices" role="group" aria-label="Answer choices"></div>
        <div class="feedback" id="feedback" hidden></div>
        <div class="quiz-actions">
          <button type="button" class="btn btn-primary" id="btn-next" hidden>Next question</button>
        </div>
      </article>
    </section>

    <section id="screen-results" class="screen screen-results" hidden>
      <p class="eyebrow">Nice work</p>
      <h1 class="brand results-brand">Your results</h1>
      <p class="score-big" id="score-final"></p>
      <p class="lede" id="score-message"></p>
      <div class="cta-row">
        <button type="button" class="btn btn-primary" id="btn-retry">Try again</button>
        <button type="button" class="btn btn-ghost" id="btn-review">Review missed</button>
      </div>
      <ul class="missed-list" id="missed-list" hidden></ul>
    </section>
  </main>

  <script src="quiz-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
